<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A study game for OCP Java SE 21 Chapter 1: eight zones of challenges and a timed final exam.">
<title>Heap Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a blueprint "heap" — each chapter zone is an object at a fake address; levels play as a single focused card. */
:root{
  --paper:#edf2f7; --panel:#ffffff; --ink:#13243a; --muted:#56687e; --line:#c3d0de; --grid:rgba(40,90,150,.07);
  --accent:#d9601f; --accent-ink:#ffffff; --good:#2c8653; --bad:#c23b3b; --soft:#e2e9f1;
  --code-bg:#14263d; --code-fg:#dce6f2; --kw:#ff9d5c; --str:#9fd9a8; --cm:#7f93ab; --num:#f2c86b;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1a2b; --panel:#15263c; --ink:#e4edf7; --muted:#93a6bd; --line:#2b415e; --grid:rgba(120,170,230,.06);
  --accent:#f08a4b; --accent-ink:#1a0d04; --good:#53c486; --bad:#f06b6b; --soft:#1c3049;
  --code-bg:#091321; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1a2b; --panel:#15263c; --ink:#e4edf7; --muted:#93a6bd; --line:#2b415e; --grid:rgba(120,170,230,.06);
  --accent:#f08a4b; --accent-ink:#1a0d04; --good:#53c486; --bad:#f06b6b; --soft:#1c3049;
  --code-bg:#091321; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:.08em .35em;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:4px 18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.7rem;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.82rem;align-items:center}
.stat b{font-size:1rem;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.66rem}
.xpbar{width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* Map */
.intro{max-width:62ch;color:var(--muted);margin:0 0 20px}
.heap-label{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.zone{position:relative;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-height:132px;transition:transform .15s,border-color .15s}
.zone:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.zone:disabled{cursor:not-allowed;opacity:.5}
.zone .addr{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between}
.zone h3{font-size:1.12rem}
.zone p{margin:0;font-size:.86rem;color:var(--muted)}
.zone .stars{margin-top:auto;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.15em;color:var(--accent)}
.zone.done{border-color:var(--good)}
.zone.exam{grid-column:1/-1;background:var(--ink);color:var(--paper);border-color:var(--ink);min-height:0}
.zone.exam p,.zone.exam .addr{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.zone.exam .stars{color:var(--accent)}
.foot{margin-top:22px;display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted)}

/* Card */
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:22px clamp(16px,4vw,30px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.back{background:none;border:1.5px solid var(--line);border-radius:5px;padding:5px 12px;font-size:.85rem}
.hearts{font-family:var(--f-mono);font-size:1rem;letter-spacing:.2em;color:var(--bad)}
.hearts .lost{color:var(--line)}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
.lesson h2{font-size:1.6rem;margin-bottom:14px}
.lesson p,.lesson li{max-width:66ch}
.lesson ul{padding-left:1.2em}
.lesson li{margin-bottom:6px}
.traps{margin-top:18px;border:1.5px dashed var(--accent);border-radius:6px;padding:12px 16px;background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.traps h3{font-size:.95rem;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.traps ul{margin:0}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;font-size:.88rem;min-width:420px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:11px 22px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.03em}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1.5px solid var(--line);border-radius:6px;padding:10px 18px;font-family:var(--f-display);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}

/* Question */
.qtext{font-size:1.12rem;font-weight:500;margin:0 0 12px;max-width:66ch}
pre.code{background:var(--code-bg);color:var(--code-fg);font:14px/1.6 var(--f-mono);padding:14px 16px;border-radius:6px;overflow-x:auto;margin:0 0 16px;tab-size:4}
pre.code .k{color:var(--kw)} pre.code .s{color:var(--str)} pre.code .c{color:var(--cm);font-style:italic} pre.code .n{color:var(--num)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;flex:none;margin-top:2px}
.opt .t{min-width:0}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;border-left:4px solid var(--good);padding:10px 14px;background:var(--soft);border-radius:0 6px 6px 0}
.feedback.bad{border-left-color:var(--bad)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.feedback p{margin:4px 0 0;max-width:66ch}
.combo{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
/* order */
.pool,.seq{display:flex;flex-direction:column;gap:8px}
.seq{min-height:52px;border:1.5px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.seq .ph{color:var(--muted);font-size:.85rem;padding:6px}
.chip{text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:5px;padding:8px 12px;font-size:.92rem}
.chip .n{font-family:var(--f-mono);color:var(--accent);margin-right:8px}
.chip.right{border-color:var(--good)} .chip.wrong{border-color:var(--bad)}

/* results */
.big{font-family:var(--f-display);font-size:clamp(2.6rem,9vw,4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--f-display);font-size:1.3rem;margin:6px 0 14px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.breakdown{display:grid;gap:6px;margin:14px 0}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:.88rem}
.brow .bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:3px}
.brow .bar i{display:block;height:100%}
.brow span{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.review{margin-top:18px;display:grid;gap:14px}
.ritem{border-top:1px solid var(--line);padding-top:12px}
.ritem .qtext{font-size:1rem}
.ritem .ans{font-size:.9rem;margin:4px 0}
.ritem .ans.y{color:var(--bad)} .ritem .ans.c{color:var(--good)}
.choose{display:inline-block;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;margin-bottom:10px}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.95rem;border:1.5px solid var(--line);border-radius:5px;padding:3px 10px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-family:var(--f-display);font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.xpbar{width:80px}.brand h1{font-size:1.4rem}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hud">
    <div class="brand"><h1>Heap Quest</h1><span>OCP Java SE 21 · Ch. 1</span></div>
    <div class="stats">
      <div class="stat"><small>Rank</small><b id="rank">javac Apprentice</b><div class="xpbar"><i id="xpfill"></i></div></div>
      <div class="stat"><small>XP</small><b id="xp">0</b></div>
      <div class="stat"><small>Zones cleared</small><b id="cleared">0/8</b></div>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const LEVELS = [
{id:"life", name:"Object Life-cycle", addr:"@7a3f", blurb:"new, references, and who the garbage collector takes.",
lesson:`<p>A <b>class</b> is the blueprint. An <b>object</b> is one instance built from it, and it lives on the heap.</p>
<p><code>Book b = new Book("Java");</code> does three things: it declares a reference variable <code>b</code>, uses <code>new</code> to allocate the object and run its constructor, then stores a reference to that object in <code>b</code>.</p>
<p>A variable holds a <i>reference</i>, never the object itself. Two variables can point at the same object. Setting one of them to <code>null</code> only cuts that one link.</p>
<p>An object becomes <b>eligible</b> for garbage collection when no live reference can reach it. Eligible doesn't mean collected: <code>System.gc()</code> is only a request, and the JVM is free to ignore it.</p>`,
traps:["Count objects, not variables. Draw arrows on paper for GC questions.","Two objects that only point at each other (an \u201cisland\u201d) are still eligible.","<code>finalize()</code> is deprecated for removal. Never rely on it running."],
qs:[
{type:"mcq",q:"After these lines run, how many Book objects are eligible for garbage collection?",code:`Book a = new Book();
Book b = a;
a = null;`,opts:["0","1","2","It depends on the JVM"],a:0,why:"Only one Book was ever created, and <code>b</code> still points at it. Nulling <code>a</code> removed one link, not the object."},
{type:"mcq",q:"Which object is eligible for GC after the last line?",code:`Book a = new Book("A");
Book b = new Book("B");
a = b;
b = null;`,opts:["Book \"A\" only","Book \"B\" only","Both","Neither"],a:0,why:"<code>a = b</code> moves <code>a</code> onto Book B, so nothing points at Book A anymore. Book B is still reachable through <code>a</code>."},
{type:"mcq",q:"What does calling <code>System.gc()</code> guarantee?",opts:["Nothing. It's a suggestion the JVM may ignore.","All eligible objects are freed before the next line","finalize() runs on every eligible object","The heap is compacted"],a:0,why:"The JVM decides when to collect. <code>System.gc()</code> only asks."},
{type:"mcq",q:"Two Node objects reference each other, and no variable in the program references either one. Are they eligible?",opts:["Yes, both are eligible","No, they keep each other alive","Only the one created first","Only if you call System.gc()"],a:0,why:"Reachability is measured from live roots (local variables, static fields, active threads). An island with no path from a root is garbage."},
{type:"mcq",q:"In <code>Book b = new Book();</code>, what does the variable <code>b</code> contain?",opts:["A reference to the object","The Book object itself","A copy of the Book class","The constructor's return value"],a:0,why:"Reference-type variables store references. The object lives on the heap."}
]},
{id:"pkg", name:"Packages & Imports", addr:"@2c91", blurb:"Keywords, comments, file order, and import collisions.",
lesson:`<p><b>Keywords</b> are reserved and all lowercase. <code>Class</code>, <code>Main</code> or <code>String</code> are legal identifiers. <code>class</code> is not.</p>
<p>Three comment styles: <code>//</code> to end of line, <code>/* ... */</code> block, and <code>/** ... */</code> javadoc. Block comments do <b>not</b> nest.</p>
<p>A source file goes in this order: at most one <code>package</code> statement (only comments may come before it), then <code>import</code> statements, then type declarations.</p>
<ul>
<li><code>java.lang</code> is imported automatically. So are classes in your own package.</li>
<li><code>import java.util.*;</code> brings in classes of <code>java.util</code> only, not subpackages like <code>java.util.function</code>.</li>
<li>An explicit import (<code>java.sql.Date</code>) beats a wildcard (<code>java.util.*</code>) when names clash.</li>
<li>Two wildcards that both contain <code>Date</code> compile fine until you actually use <code>Date</code>. Then it's ambiguous.</li>
<li>Two explicit imports of the same simple name fail right away.</li>
<li>Redundant or unused imports compile.</li>
</ul>`,
traps:["Wildcards are never recursive.","Using a fully qualified name (<code>java.util.Date</code>) always resolves a collision.","An import before the package statement doesn't compile."],
qs:[
{type:"mcq",q:"Does this file compile?",code:`import java.util.ArrayList;
package shop;

public class Cart { }`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"<code>package</code> must be the first statement. Only comments may come before it."},
{type:"mcq",q:"What happens here?",code:`import java.util.*;
import java.sql.*;

public class Report {
    Date created;
}`,opts:["Doesn't compile: Date is ambiguous","Uses java.util.Date","Uses java.sql.Date","Compiles with a warning"],a:0,why:"Both wildcards supply a <code>Date</code> and neither is more specific, so using the name is ambiguous."},
{type:"mcq",q:"Which Date does <code>created</code> use?",code:`import java.util.*;
import java.sql.Date;

public class Report {
    Date created;
}`,opts:["java.sql.Date","java.util.Date","Doesn't compile","Whichever loads first"],a:0,why:"A single-type import takes priority over a wildcard."},
{type:"mcq",q:"Does <code>import java.util.*;</code> let you write <code>Predicate&lt;String&gt;</code> without another import?",opts:["No, Predicate is in java.util.function","Yes, wildcards include subpackages","Yes, Predicate is in java.lang","Only inside a lambda"],a:0,why:"Wildcards cover exactly one package. <code>java.util.function</code> is a different package."},
{type:"mcq",q:"Does this compile?",code:`/* outer comment /* inner */ still a comment? */
public class A { }`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"The first <code>*/</code> closes the comment. <code>still a comment? */</code> is then parsed as code."},
{type:"mcq",q:"Is <code>int Class = 5;</code> legal?",opts:["Yes, Class isn't a keyword","No, Class is reserved","Only inside a static method","Only with a warning"],a:0,why:"Keywords are case-sensitive. <code>class</code> is reserved, <code>Class</code> is just a name (and also a type in java.lang)."}
]},
{id:"access", name:"Access Modifiers", addr:"@5e08", blurb:"private, package-private, protected, public.",
lesson:`<div class="tbl"><table><tr><th>Modifier</th><th>Same class</th><th>Same package</th><th>Subclass, other package</th><th>Anywhere</th></tr>
<tr><td><code>private</code></td><td>yes</td><td>no</td><td>no</td><td>no</td></tr>
<tr><td>(none) package-private</td><td>yes</td><td>yes</td><td>no</td><td>no</td></tr>
<tr><td><code>protected</code></td><td>yes</td><td>yes</td><td>yes, via inheritance</td><td>no</td></tr>
<tr><td><code>public</code></td><td>yes</td><td>yes</td><td>yes</td><td>yes</td></tr></table></div>
<p>A <b>top-level</b> class can only be <code>public</code> or package-private. Fields, methods, constructors and nested classes can use all four.</p>
<p>Package-private has no keyword. You just leave the modifier off.</p>`,
traps:["There's no <code>default</code> access keyword. Writing <code>default void m()</code> in a class doesn't compile.","In another package, a subclass can reach a protected member through inheritance (<code>this</code> or its own type), not through a reference typed as the parent class.","At most one public top-level type per file, and its name must match the file."],
qs:[
{type:"order",q:"Tap the modifiers from MOST restrictive to LEAST restrictive.",items:["private","package-private (no modifier)","protected","public"],why:"private → same class; package-private → + package; protected → + subclasses elsewhere; public → everyone."},
{type:"mcq",q:"Does this compile as a top-level class in Shop.java?",code:`private class Shop { }`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"Top-level classes may only be public or package-private."},
{type:"mcq",q:"Dog is in package <code>zoo</code>, Animal in package <code>farm</code>. Does Dog compile?",code:`package farm;
public class Animal {
    protected void eat() { }
}

package zoo;
public class Dog extends farm.Animal {
    void dinner() { eat(); }
}`,opts:["Compiles","Doesn't compile"],a:0,fixed:true,why:"Dog calls its inherited protected method on itself. That's exactly what protected allows across packages."},
{type:"mcq",q:"<code>void ring()</code> has no modifier and is in class Phone in package <code>a</code>. Who can call it?",opts:["Only classes in package a","Any subclass, any package","Everyone","Only Phone itself"],a:0,why:"No modifier = package-private. Subclasses in other packages can't see it."},
{type:"mcq",q:"Which member declaration inside a class does NOT compile?",opts:["default int count;","protected int count;","private int count;","int count;"],a:0,why:"<code>default</code> is a keyword for switch labels and interface methods, not an access modifier for class members."}
]},
{id:"members", name:"Classes & Members", addr:"@9b44", blurb:"Identifiers, static vs instance, fields and defaults.",
lesson:`<p>Shape of a class: <code>[modifier] class Name [extends OneClass] [implements A, B] { ... }</code>. One superclass only; any number of interfaces.</p>
<p><b>Identifiers</b> must start with a letter, <code>$</code> or <code>_</code>. Later characters can also be digits. No keywords, case-sensitive, no length limit. A lone <code>_</code> is not a legal name.</p>
<p><b>static</b> members belong to the class: one copy, shared by every object. Instance members belong to each object. Static code has no <code>this</code>, so it can't use instance members without an object reference.</p>
<p>You can call a static member through an instance reference. It compiles (with a warning), even when that reference is <code>null</code>.</p>
<p><b>Fields</b> get default values: <code>0</code>, <code>0.0</code>, <code>false</code>, <code>'\\u0000'</code>, <code>null</code>. <b>Local variables</b> get none. Reading one before assigning it is a compile error.</p>
<p>A <code>final</code> field must be assigned exactly once. For instance fields: at declaration, in an instance initializer, or in every constructor. For <code>static final</code>: at declaration or in a static block, with any expression, not just a constant.</p>`,
traps:["<code>2fast</code>, <code>my-var</code>, <code>class</code> and <code>_</code> are all illegal names.","A static method referencing an instance field directly doesn't compile.","Defaults apply to fields and array elements, never to locals."],
qs:[
{type:"mcq",q:"Which identifier is legal?",opts:["$total","2fast","my-var","_"],a:0,why:"Identifiers may start with $. Digits can't come first, hyphens aren't allowed, and a lone underscore is reserved."},
{type:"mcq",q:"Does this compile?",code:`public class Counter {
    int hits;
    static void reset() {
        hits = 0;
    }
}`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"<code>reset()</code> is static, so there's no object whose <code>hits</code> it could change."},
{type:"mcq",q:"What happens?",code:`public class Stats {
    int hits;
    void show() {
        int local;
        System.out.println(hits);
        System.out.println(local);
    }

{id:"methods", name:"Methods & Arguments", addr:"@c1d2", blurb:"Signatures, return rules, and pass-by-value.",
lesson:`<p>Shape of a method: <code>[access] [specifiers] returnType name(params) [throws X, Y] { ... }</code>. The return type is mandatory; use <code>void</code> for none.</p>
<p>The <b>signature</b> is the name plus the ordered parameter types. Return type, parameter names, modifiers and <code>throws</code> are not part of it. Two methods with the same signature in one class don't compile.</p>
<p>A non-void method must return a value on every path. A <code>final</code> parameter can't be reassigned inside the method.</p>
<p>Java is <b>always pass-by-value</b>:</p>
<ul><li>Primitive argument: the method gets a copy of the value. Changes stay inside.</li>
<li>Reference argument: the method gets a copy of the reference. It can change the object's state (<code>sb.append(...)</code>), but reassigning the parameter (<code>sb = new ...</code>) doesn't affect the caller.</li>
<li><code>String</code> is immutable, so <code>s = s + "!"</code> inside a method makes a new String the caller never sees.</li></ul>`,
traps:["Mutating the object is visible to the caller; reassigning the parameter is not.","Same name + same parameter types with a different return type is a duplicate, not an overload."],
qs:[
{type:"mcq",q:"Which of these is part of a method's signature?",opts:["Parameter types, in order","Return type","Parameter names","The throws clause"],a:0,why:"Signature = name + ordered parameter types. Nothing else."},
{type:"mcq",q:"What prints?",code:`static void grow(StringBuilder b) {
    b.append(", World!");
}
// main:
StringBuilder sb = new StringBuilder("Hello");
grow(sb);
System.out.println(sb);`,opts:["Hello, World!","Hello","Doesn't compile",", World!"],a:0,why:"The method received a copy of the reference, which still points at the same StringBuilder. append mutates that object."},
{type:"mcq",q:"What prints?",code:`static void swap(StringBuilder b) {
    b = new StringBuilder("World");
}
// main:
StringBuilder sb = new StringBuilder("Hello");
swap(sb);
System.out.println(sb);`,opts:["Hello","World","HelloWorld","null"],a:0,why:"Reassigning the parameter only changes the method's local copy of the reference."},
{type:"mcq",q:"What prints?",code:`static void shout(String s) {
    s = s + "!";
}
// main:
String msg = "Hi";
shout(msg);
System.out.println(msg);`,opts:["Hi","Hi!","Doesn't compile","null"],a:0,why:"Strings are immutable. The concatenation creates a new String assigned only to the local parameter."},
{type:"mcq",q:"Does this class compile?",code:`public class Calc {
    int area(int side) { return side * side; }
    long area(int width) { return width; }
}`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"Both signatures are <code>area(int)</code>. A different return type or parameter name doesn't make it an overload."}
]},
{id:"overload", name:"Overloading & Varargs", addr:"@3f6a", blurb:"How javac picks a method, varargs rules, and main.",
lesson:`<p><b>Overloading</b>: same name, different parameter list. Changing only the return type or <code>throws</code> clause is a compile error.</p>
<p>The compiler resolves a call in phases and stops at the first phase that finds a match:</p>
<ul><li><b>1.</b> Exact match</li><li><b>2.</b> Primitive widening (<code>int</code> → <code>long</code> → <code>float</code> → <code>double</code>)</li><li><b>3.</b> Autoboxing / unboxing (<code>int</code> → <code>Integer</code>)</li><li><b>4.</b> Varargs</li></ul>
<p>Inside a phase the most specific method wins. If two are equally specific, the call is ambiguous and won't compile.</p>
<p><b>Varargs</b> (<code>int... nums</code>): must be the last parameter, only one per method, and is an array inside the method. Call it with a list, with an array, or with nothing (you get an empty array, length 0). <code>int[]</code> and <code>int...</code> count as the same signature.</p>
<p><b>main</b>: <code>public static void main(String[] args)</code>. <code>String... args</code>, <code>final String[] args</code> and <code>static public</code> also work. You can overload <code>main</code>, but only that signature is the entry point.</p>`,
traps:["Widening beats boxing, and boxing beats varargs. The guide only mentions widening.","<code>null</code> passed to <code>p(Object)</code> and <code>p(String)</code> picks String, the more specific type.","<code>void m(int a, long b)</code> and <code>void m(long a, int b)</code> with <code>m(1, 2)</code> is ambiguous."],
qs:[
{type:"mcq",q:"What prints?",code:`static void go(long x)    { System.out.print("long"); }
static void go(Integer x) { System.out.print("Integer"); }
static void go(int... x)  { System.out.print("varargs"); }

go(5);`,opts:["long","Integer","varargs","Doesn't compile: ambiguous"],a:0,why:"No exact <code>go(int)</code>, so phase 2 (widening) finds <code>go(long)</code> before boxing or varargs are tried."},
{type:"mcq",q:"Same calls, but <code>go(long)</code> is deleted. What prints now?",code:`static void go(Integer x) { System.out.print("Integer"); }
static void go(int... x)  { System.out.print("varargs"); }

go(5);`,opts:["Integer","varargs","Doesn't compile","long"],a:0,why:"Phase 3 (boxing) finds <code>go(Integer)</code>. Varargs is the last resort."},
{type:"mcq",q:"Does this compile?",code:`public class MathBox {

    void sum(int... nums) { }
}`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"<code>int...</code> is an array parameter. Both methods have the signature <code>sum(int[])</code>."},
{type:"mcq",q:"Which declaration is legal?",opts:["void log(int level, String... parts)","void log(String... parts, int level)","void log(String... a, int... b)","void log(String parts...)"],a:0,why:"Varargs must be last, only one per method, and the dots go after the type."},

{type:"mcq",q:"On standard Java 21, which method works as a program entry point?",opts:["public static void main(String... args)","public void main(String[] args)","public static int main(String[] args)","public static void Main(String[] args)"],a:0,why:"Varargs is fine. It must be static, return void, and be named main in lowercase."}
]},
{id:"init", name:"Constructors & Init", addr:"@88e0", blurb:"Constructors, initializer blocks, and the real order.",
lesson:`<p>A <b>constructor</b> has the class's name and no return type. Add <code>void</code> and it becomes an ordinary method that happens to share the name.</p>
<p>The compiler adds a no-arg default constructor <b>only if you declare none</b>. Declare <code>Cake(String f)</code> and <code>new Cake()</code> stops compiling.</p>
<p>A constructor's first statement is <code>this(...)</code> or <code>super(...)</code>. If you write neither, the compiler inserts <code>super()</code>. You can't have both.</p>
<p>An instance initializer <code>{ ... }</code> runs on every <code>new</code>. A static initializer <code>static { ... }</code> runs once, when the class is initialized.</p>
<p><b>The order</b> (the study guide gets this wrong):</p>
<ul><li><b>Class first used:</b> static field initializers and static blocks, in source order. Superclass before subclass. Once only.</li>
<li><b>Each <code>new</code>:</b> all fields start at defaults (0/false/null), then the superclass constructor runs, then instance field initializers and instance blocks in source order, then the rest of the constructor body.</li></ul>`,
traps:["<code>int x = 1;</code> is a field initializer. Its value is set in step 3, after super() — the default is 0, not 1.","Field initializers and instance blocks are one combined list, run top to bottom.","<code>this(...)</code> and <code>super(...)</code> can't both appear."],
qs:[
{type:"order",q:"Tap these in the order they run the first time <code>new Child()</code> executes.",items:["Static initializers (once, source order)","Superclass constructor","Instance field initializers & instance blocks (source order)","Rest of the constructor body"],why:"Class initialization happens first, once. Then for each object: super(), then instance initializers top to bottom, then the constructor body."},
{type:"mcq",q:"What prints?",code:`class Init {

    { x = x * 10; }
    Init() { x = x + 5; }

{type:"mcq",q:"Does the last line compile?",code:`class Cake {

{type:"mcq",q:"Inside class Cake, what is <code>public void Cake() { }</code>?",opts:["A regular method named Cake","A constructor","A compile error","A static initializer"],a:0,why:"Constructors have no return type. With <code>void</code> it's a method. Legal, confusing, and a favorite exam trick."},
{type:"mcq",q:"What prints?",code:`public class Order {
    static { System.out.print("S"); }
    { System.out.print("I"); }
    Order() { System.out.print("C"); }

    public static void main(String[] a) {
        System.out.print("M");
        new Order();
        new Order();
    }
}`,opts:["SMICIC","MSICIC","SMICC","SICICM"],a:0,why:"The class is initialized before main runs (S). Then M. Each new prints I then C."}
]},
{id:"nested", name:"Object & Nested Classes", addr:"@e4b7", blurb:"What every class inherits, and the four nested kinds.",
lesson:`<p>Every class extends <code>java.lang.Object</code> and inherits <code>toString()</code>, <code>equals()</code> (default compares with <code>==</code>), <code>hashCode()</code>, <code>getClass()</code> (final) and <code>clone()</code> (protected; needs <code>Cloneable</code>).</p>
<p>Override <code>equals</code> → also override <code>hashCode</code>. Equal objects must have equal hash codes, or HashSet and HashMap break.</p>
<div class="tbl"><table><tr><th>Kind</th><th>Create it with</th><th>Key rules</th></tr>
<tr><td>Static nested</td><td><code>new Outer.Nested()</code></td><td>No outer instance. Sees outer static members; instance members only through an object.</td></tr>
<tr><td>Inner</td><td><code>outer.new Inner()</code></td><td>Tied to an outer instance. Sees every outer member, private too.</td></tr>
<tr><td>Local</td><td><code>new Local()</code> inside the block</td><td>Declared in a method or block. No access modifiers. Captures final or effectively final locals.</td></tr>
<tr><td>Anonymous</td><td><code>new Type() { ... }</code></td><td>Extends one class OR implements one interface. No constructor; use an instance initializer.</td></tr></table></div>
<p>Nested member classes take all four access modifiers. Since Java 16, inner classes may declare static members too.</p>`,
traps:["From a static method of Outer, <code>new Inner()</code> doesn't compile. You need an Outer instance.","Reassigning a local variable anywhere makes it not effectively final, so a local or anonymous class can't use it.","<code>getClass()</code> can't be overridden."],
qs:[
{type:"mcq",q:"From another class, how do you create an instance of the inner class <code>Outer.Inner</code>?",opts:["outer.new Inner() — with Outer outer = new Outer()","new Outer.Inner()","Outer.new Inner()","new Outer().Inner()"],a:0,why:"An inner object needs an enclosing instance. <code>new Outer.Inner()</code> is the syntax for a static nested class."},
{type:"mcq",q:"Does this compile?",code:`class Outer {
    private int id = 7;
    static class Nested {
        int read() { return id; }
    }
}`,opts:["Compiles","Doesn't compile"],a:1,fixed:true,why:"A static nested class has no enclosing instance, so it can't read the instance field <code>id</code> directly."},
{type:"mcq",q:"Does this compile?",code:`void run() {

{type:"mcq",q:"Which is true about anonymous classes?",opts:["They can use an instance initializer but can't declare a constructor","They can extend a class and implement an interface at once","They can be declared private","They can declare a constructor named after their parent"],a:0,why:"No name, so no constructor. One supertype only."},
{type:"mcq",q:"You override <code>equals()</code> but not <code>hashCode()</code>. What's the real risk?",opts:["Equal objects land in different buckets, so HashSet can hold \"duplicates\"","Compile error","equals() is ignored at runtime","toString() stops working"],a:0,why:"The contract says equal objects must have equal hash codes. The compiler doesn't check it; your collections silently misbehave."},
{type:"mcq",q:"Which Object method can't be overridden?",opts:["getClass()","toString()","hashCode()","equals()"],a:0,why:"getClass() is final."}
]}

const RANKS=[[0,"javac Apprentice"],[90,"Bytecode Reader"],[220,"Heap Walker"],[380,"GC Whisperer"],[560,"OCP Candidate"]];
const KEY="heapquest.v1";
let S = {xp:0, stars:{}, best:null, unlockAll:false};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} hud(); }

const $=s=>document.querySelector(s);
const app=$("#app");
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const KW="abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|extends|final|finally|float|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|true|false";
function hl(code){
  const re=new RegExp(`(\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\]|\\\\.)*")|\\b(${KW})\\b|\\b(\\d+L?)\\b`,"gm");
  let out="",last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?"c":m[2]?"s":m[3]?"k":"n";
    out+=`<span class="${cls}">${esc(m[0])}</span>`; last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1600);}
function rank(){let r=RANKS[0],next=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];next=RANKS[i+1]||null;}}return{r,next};}
function hud(){
  const {r,next}=rank();
  $("#rank").textContent=r[1]; $("#xp").textContent=S.xp;
  $("#xpfill").style.width=next?Math.min(100,(S.xp-r[0])/(next[0]-r[0])*100)+"%":"100%";
  $("#cleared").textContent=Object.keys(S.stars).length+"/8";
}
function addXP(n){const before=rank().r[1];S.xp+=n;save();const after=rank().r[1];if(after!==before)toast("Rank up: "+after);}
function unlocked(i){return S.unlockAll||i===0||S.stars[LEVELS[i-1].id]!=null;}

/* ---------- MAP ---------- */
function map(){
  const zones=LEVELS.map((L,i)=>{
    const st=S.stars[L.id], open=unlocked(i);
    const stars=st!=null?"★".repeat(st)+"☆".repeat(3-st):open?"not cleared":"locked";
    return `<button class="zone ${st!=null?"done":""}" data-i="${i}" ${open?"":"disabled"}>
      <div class="addr"><span>Zone ${i+1}</span><span>${L.addr}</span></div>
      <h3>${L.name}</h3><p>${L.blurb}</p><div class="stars">${stars}</div></button>`;
  }).join("");
  const allDone=Object.keys(S.stars).length===8;
  const best=S.best!=null?`Best score: ${S.best}/20`:"Not attempted";
  app.innerHTML=`<p class="intro">Eight zones of the heap, one per part of Chapter 1. Each zone opens with a short briefing, then challenges. You have 3 hearts per zone. Run out and you hit a StackOverflowError and replay it. Clear all eight to face the final exam.</p>
  <div class="heap-label">Heap map</div>
  <div class="zones">${zones}
   <button class="zone exam" id="examBtn" ${allDone||S.unlockAll?"":"disabled"}>
     <div class="addr"><span>Final</span><span>@ffff</span></div>
     <h3>Final Exam · 20 questions · 48 minutes</h3>
     <p>Drawn at random from a pool of 40, so each attempt is a different mix. Multi-select questions are all-or-nothing. Timed at 2.4 minutes per question, the real exam's pace. Pass mark 68%.</p>
     <div class="stars">${allDone||S.unlockAll?best:"Clear all 8 zones to unlock"}</div></button>
  </div>
  <div class="foot">
    <button class="linkbtn" id="unlock">${S.unlockAll?"Re-lock zones":"Unlock everything (skip the progression)"}</button>
    <button class="linkbtn" id="reset">Reset progress</button>
  </div>`;
  app.querySelectorAll(".zone[data-i]").forEach(b=>b.onclick=()=>briefing(+b.dataset.i));
  $("#examBtn").onclick=startExam;
  $("#unlock").onclick=()=>{S.unlockAll=!S.unlockAll;save();map();};
  $("#reset").onclick=e=>{
    if(e.target.dataset.c){S={xp:0,stars:{},best:null,unlockAll:false};save();map();toast("Progress reset");}
    else{e.target.dataset.c="1";e.target.textContent="Tap again to confirm reset";}
  };
  window.scrollTo(0,0);
}

/* ---------- LEVEL ---------- */
let G=null;
function briefing(i){
  const L=LEVELS[i];
  app.innerHTML=`<div class="card lesson pop">
   <div class="topbar"><button class="back" id="bk">← Map</button><span class="eyebrow">Zone ${i+1} · ${L.addr} · Briefing</span></div>
   <h2>${L.name}</h2>${L.lesson}
   <div class="traps"><h3>Exam traps</h3><ul>${L.traps.map(t=>`<li>${t}</li>`).join("")}</ul></div>
   <div class="actions"><button class="primary" id="go">Start ${L.qs.length} challenges</button></div></div>`;
  $("#bk").onclick=map; $("#go").onclick=()=>startLevel(i);
  window.scrollTo(0,0);
}
function startLevel(i){G={i,L:LEVELS[i],qi:0,hearts:3,combo:0,earned:0,mode:"level"};renderQ();}
function heartsHTML(){return "♥".repeat(G.hearts)+`<span class="lost">${"♥".repeat(3-G.hearts)}</span>`;}

function renderQ(){
  const L=G.L,q=L.qs[G.qi];
  app.innerHTML=`<div class="card pop" id="qc">
   <div class="topbar"><button class="back" id="bk">← Briefing</button>
     <span class="combo" id="combo">${G.combo>1?"combo ×"+G.combo:""}</span>
     <span class="hearts" aria-label="${G.hearts} hearts left">${heartsHTML()}</span></div>
   <div class="progress"><i style="width:${G.qi/L.qs.length*100}%"></i></div>
   <div class="eyebrow">${L.name} · ${G.qi+1}/${L.qs.length}</div>
   <div id="qbody"></div><div id="fb"></div>
   <div class="actions" id="act"></div></div>`;
  $("#bk").onclick=()=>briefing(G.i);
  drawQuestion(q,$("#qbody"),ok=>answered(q,ok));
}

function drawQuestion(q,host,onDone,examMode){
  let h=`<p class="qtext">${q.q}</p>`;
  if(q.code)h+=`<pre class="code">${hl(q.code)}</pre>`;
  if(q.type==="order"){
    h+=`<div class="seq" id="seq"><span class="ph">Tap items below in order…</span></div><div class="pool" id="pool"></div>`;
    host.innerHTML=h;
    const pool=$("#pool"),seq=$("#seq"),picked=[];
    const items=shuffle(q.items);
    const act=examMode?null:$("#act");
    function draw(){
      pool.innerHTML=items.filter(x=>!picked.includes(x)).map(x=>`<button class="chip">${x}</button>`).join("");
      seq.innerHTML=picked.length?picked.map((x,k)=>`<div class="chip"><span class="n">${k+1}</span>${x}</div>`).join(""):`<span class="ph">Tap items below in order…</span>`;
      pool.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{picked.push(b.textContent);draw();});
      if(act)act.innerHTML=`<button class="primary" id="chk" ${picked.length===items.length?"":"disabled"}>Check order</button><button class="ghost" id="clr">Clear</button>`;
      if(act){$("#clr").onclick=()=>{picked.length=0;draw();};$("#chk").onclick=()=>{
        const ok=picked.every((x,k)=>x===q.items[k]);
        seq.querySelectorAll(".chip").forEach((c,k)=>c.classList.add(picked[k]===q.items[k]?"right":"wrong"));
        pool.innerHTML="";onDone(ok);};}
    }
    draw(); return;
  }
  if(q.type==="multi"){
    h=`<div class="choose">Choose ${["","one","two","three"][q.pick]} · all or nothing</div>`+h;
    const order=shuffle(q.opts.map((_,k)=>k));
    h+=`<div class="opts">${order.map((k,n)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="key">${n+1}</span><span class="t">${q.opts[k]}</span></button>`).join("")}</div>`;
    host.innerHTML=h;
    const btns=[...host.querySelectorAll(".opt")],sel=new Set(),act=examMode?null:$("#act");
    const check=()=>{
      btns.forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove("sel");
        if(q.a.includes(k))b.classList.add("right");else if(sel.has(k))b.classList.add("wrong");});
      act.innerHTML="";onDone(isRight(q,[...sel]));
    };
    const upd=()=>{
      if(act){act.innerHTML=`<button class="primary" id="chk" ${sel.size===q.pick?"":"disabled"}>Check (${sel.size}/${q.pick} picked)</button>`;$("#chk").onclick=check;}
      else onDone([...sel]);
    };
    btns.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
      if(sel.has(k))sel.delete(k);else sel.add(k);
      b.classList.toggle("sel",sel.has(k));b.setAttribute("aria-pressed",sel.has(k));upd();});
    keyHandler=e=>{const n=+e.key;if(n>=1&&n<=btns.length&&!btns[n-1].disabled)btns[n-1].click();};
    upd();
    return {restore(arr){arr.forEach(k=>{sel.add(k);const b=host.querySelector(`.opt[data-k="${k}"]`);if(b)b.classList.add("sel");});upd();}};
  }
  const order=q.fixed?q.opts.map((_,k)=>k):shuffle(q.opts.map((_,k)=>k));
  h+=`<div class="opts">${order.map((k,n)=>`<button class="opt" data-k="${k}"><span class="key">${n+1}</span><span class="t">${q.opts[k]}</span></button>`).join("")}</div>`;
  host.innerHTML=h;
  const btns=[...host.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(examMode){btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");onDone(k);return;}
    btns.forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right");});
    if(k!==q.a)b.classList.add("wrong");
    onDone(k===q.a);
  });
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=btns.length&&!btns[n-1].disabled)btns[n-1].click();};
}
let keyHandler=null;
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){const p=$("#next");if(p){p.click();return;}}
  if(keyHandler)keyHandler(e);
});

function answered(q,ok){
  keyHandler=null;
  const fb=$("#fb");
  if(ok){G.combo++;const gain=10+Math.min(10,(G.combo-1)*2);G.earned+=gain;addXP(gain);
    $("#combo").textContent=G.combo>1?"combo ×"+G.combo:"";
    fb.innerHTML=`<div class="feedback"><b>Correct · +${gain} XP</b><p>${q.why}</p></div>`;
  }else{G.combo=0;G.hearts--;$("#combo").textContent="";
    document.querySelector(".hearts").innerHTML=heartsHTML();$("#qc").classList.add("shake");
    fb.innerHTML=`<div class="feedback bad"><b>Not quite</b><p>${q.why}</p></div>`;}
  const last=G.qi===G.L.qs.length-1;
  const label=G.hearts===0?"See result":last?"Finish zone":"Next";
  $("#act").innerHTML=`<button class="primary" id="next">${label} →</button>`;
  $("#next").onclick=()=>{ if(G.hearts===0)return levelEnd(false); if(last)return levelEnd(true); G.qi++; renderQ(); };
  $("#next").focus();
}

function levelEnd(won){
  const L=G.L;
  if(won){
    const prev=S.stars[L.id];const st=G.hearts;
    if(prev==null||st>prev)S.stars[L.id]=st;
    const bonus=st*10;addXP(bonus);
    app.innerHTML=`<div class="card pop"><div class="eyebrow">Zone ${G.i+1} cleared</div>
     <div class="big" style="color:var(--accent)">${"★".repeat(st)}${"☆".repeat(3-st)}</div>
     <p class="verdict pass">${L.name} is no longer reachable by bugs.</p>
     <p>+${G.earned} XP from answers, +${bonus} XP heart bonus.${st<3?" Replay for 3 stars.":""}</p>
     <div class="actions">${G.i<7?`<button class="primary" id="nx">Next zone →</button>`:`<button class="primary" id="ex">Take the final exam →</button>`}
     <button class="ghost" id="rp">Replay</button><button class="ghost" id="mp">Map</button></div></div>`;
    if($("#nx"))$("#nx").onclick=()=>briefing(G.i+1);
    if($("#ex"))$("#ex").onclick=startExam;
  }else{
    app.innerHTML=`<div class="card pop"><div class="eyebrow">Zone ${G.i+1}</div>
     <div class="big" style="color:var(--bad)">StackOverflowError</div>
     <p class="verdict fail">Out of hearts.</p><p>Reread the briefing's traps, then go again. Option order shuffles each run.</p>
     <div class="actions"><button class="primary" id="rp">Retry zone</button><button class="ghost" id="br">Reread briefing</button><button class="ghost" id="mp">Map</button></div></div>`;
    $("#br").onclick=()=>briefing(G.i);
  }
  $("#rp").onclick=()=>startLevel(G.i); $("#mp").onclick=map;
  window.scrollTo(0,0);
}

const N=20, MINUTES=48; // 120 min / 50 q on the real exam = 2.4 min per question
function isRight(q,ans){
  if(q.type==="multi")return Array.isArray(ans)&&ans.length===q.a.length&&q.a.every(x=>ans.includes(x));
  return ans===q.a;
}
function fmtAns(q,ans){
  if(ans==null||(Array.isArray(ans)&&!ans.length))return "(no answer)";
  return Array.isArray(ans)?ans.map(k=>q.opts[k]).join(" · "):q.opts[ans];
}
let E=null;
function stopTimer(){if(E&&E.timer){clearInterval(E.timer);E.timer=null;}}
function tick(){
  const left=Math.max(0,E.end-Date.now()),el=$("#timer");
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60000);}
  if(left<=0){toast("Time's up. Exam submitted.");examEnd();}
}
function startExam(){
  stopTimer();
  E={qs:shuffle(EXAM).slice(0,N),i:0,ans:[],end:Date.now()+MINUTES*60000};
  E.timer=setInterval(tick,1000);examQ();
}
function examQ(){
  const q=E.qs[E.i];
  app.innerHTML=`<div class="card pop">
   <div class="topbar"><button class="back" id="bk">Quit exam</button><span class="eyebrow">Final exam · ${E.i+1}/${N}</span><span class="timer" id="timer"></span></div>
   <div class="progress"><i style="width:${E.i/N*100}%"></i></div>
   <div id="qbody"></div>
   <div class="actions"><button class="primary" id="next" disabled>${E.i===N-1?"Submit exam":"Next"} →</button>
   ${E.i>0?`<button class="ghost" id="prev">← Back</button>`:""}</div></div>`;
  tick();
  $("#bk").onclick=e=>{if(e.target.dataset.c){stopTimer();map();}else{e.target.dataset.c="1";e.target.textContent="Tap again to quit";}};
  const nx=$("#next"),prev=E.ans[E.i];
  const ready=a=>q.type==="multi"?Array.isArray(a)&&a.length===q.pick:a!=null;
  const ctl=drawQuestion(q,$("#qbody"),k=>{E.ans[E.i]=k;nx.disabled=!ready(k);},true);
  if(prev!=null){
    if(q.type==="multi")ctl.restore(prev);
    else{E.ans[E.i]=prev;const b=document.querySelector(`.opt[data-k="${prev}"]`);if(b)b.classList.add("sel");nx.disabled=false;}
  }
  nx.onclick=()=>{if(E.i===N-1)return examEnd();E.i++;examQ();};
  if($("#prev"))$("#prev").onclick=()=>{E.i--;examQ();};
  window.scrollTo(0,0);
}
function examEnd(){
  if(!E||E.done)return; E.done=true; stopTimer();
  keyHandler=null;
  const right=E.qs.filter((q,k)=>isRight(q,E.ans[k])).length;
  const pct=Math.round(right/N*100),pass=pct>=68;
  if(S.best==null||right>S.best)S.best=right;
  addXP(right*5+(pass?100:0));
  const by={};E.qs.forEach((q,k)=>{by[q.lv]=by[q.lv]||[0,0];by[q.lv][1]++;if(isRight(q,E.ans[k]))by[q.lv][0]++;});
  const rows=LEVELS.filter(L=>by[L.id]).map(L=>{const [r,t]=by[L.id];const p=r/t*100;
    return `<div class="brow"><div>${L.name}<div class="bar"><i style="width:${p}%;background:${p>=68?"var(--good)":"var(--bad)"}"></i></div></div><span>${r}/${t}</span></div>`;}).join("");
  const wrong=E.qs.map((q,k)=>({q,k})).filter(o=>!isRight(o.q,E.ans[o.k]));
  const review=wrong.map(({q,k})=>`<div class="ritem"><p class="qtext">${q.q}</p>${q.code?`<pre class="code">${hl(q.code)}</pre>`:""}
     <p class="ans y">Your answer: ${fmtAns(q,E.ans[k])}</p><p class="ans c">Correct: ${fmtAns(q,q.a)}</p><p>${q.why}</p></div>`).join("");
  app.innerHTML=`<div class="card pop"><div class="eyebrow">Final exam result</div>
   <div class="big">${right}/${N} <span style="font-size:.45em;color:var(--muted)">${pct}%</span></div>
   <p class="verdict ${pass?"pass":"fail"}">${pass?"Pass. You'd clear the 68% bar.":"Fail. The bar is 68% (14/20). Replay your weakest zones, then retake: you get a different mix of questions."}</p>
   <div class="heap-label">By zone · weakest bars are what to replay</div>
   <div class="breakdown">${rows}</div>
   <div class="actions"><button class="primary" id="again">Retake exam</button><button class="ghost" id="mp">Map</button></div>
   ${wrong.length?`<div class="heap-label" style="margin-top:22px">What you missed (${wrong.length})</div><div class="review">${review}</div>`:"<p>Perfect score. Nothing to review.</p>"}
  </div>`;
  $("#again").onclick=startExam;$("#mp").onclick=map;
  window.scrollTo(0,0);
}

hud(); map();
</script>
</body>
</html>
